name: Test

# Pull requests run the checks that main requires; push runs only for main itself.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# The Rust and Android builds reference OpenXPlay-Stream and OpenXPlay-DiPlay by relative path,
# so those jobs check the repositories out side by side, at the commits in stream.lock and diplay.lock.
jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  # A lock change brings in every commit in between, so the summary lists them. A locked commit that is not on
  # its repository's main yet is only a warning here; the release workflows refuse it.
  sources:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the locked commits are on main
        run: scripts/sources.sh on-main --warn stream diplay
      - name: List lock changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/sources.sh summary "$BASE" >> "$GITHUB_STEP_SUMMARY"

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenXPlay-Relay/rust
    steps:
      - uses: actions/checkout@v4
        with:
          path: OpenXPlay-Relay
      - name: Read the locked Stream commit
        id: pin
        run: |
          stream=$(OpenXPlay-Relay/scripts/sources.sh read stream)
          echo "stream=$stream" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: actions/checkout@v4
        with:
          repository: OpenXPlay/OpenXPlay-Stream
          ref: ${{ steps.pin.outputs.stream }}
          path: OpenXPlay-Stream
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy && rustup default 1.99.1
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Test
        run: cargo test --workspace --locked --offline
      - name: Test vendored mdns-sd
        run: cargo test -p mdns-sd --locked --offline
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: OpenXPlay-Relay
      - name: Read the locked commits
        id: pin
        run: |
          stream=$(OpenXPlay-Relay/scripts/sources.sh read stream)
          diplay=$(OpenXPlay-Relay/scripts/sources.sh read diplay)
          { echo "stream=$stream"; echo "diplay=$diplay"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: OpenXPlay/OpenXPlay-Stream
          ref: ${{ steps.pin.outputs.stream }}
          path: OpenXPlay-Stream
      - uses: actions/checkout@v4
        with:
          repository: OpenXPlay/OpenXPlay-DiPlay
          ref: ${{ steps.pin.outputs.diplay }}
          path: OpenXPlay-DiPlay
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: OpenXPlay-Relay/admin-web/package-lock.json
      - name: Build admin page
        working-directory: OpenXPlay-Relay/admin-web
        run: npm ci && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: OpenXPlay-Relay/android
        run: ./gradlew testDebugUnitTest -Prelay.strictSources=true
