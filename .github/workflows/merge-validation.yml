name: Merge validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  diplay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: OpenXPlay-Relay
      - name: Read DiPlay integration commit
        id: pin
        run: echo "diplay=$(cat OpenXPlay-Relay/diplay.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: OpenXPlay/OpenXPlay-DiPlay
          ref: ${{ steps.pin.outputs.diplay }}
          path: OpenXPlay-DiPlay
      - name: Reject credential files in public source
        working-directory: OpenXPlay-DiPlay
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: DiPlay required unit tests, lint and example builds
        working-directory: OpenXPlay-DiPlay
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: DiPlay test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diplay-integration-reports
          path: |
            OpenXPlay-DiPlay/shared/build/test-results/
            OpenXPlay-DiPlay/common/build/test-results/
            OpenXPlay-DiPlay/samples/home/build/test-results/
            OpenXPlay-DiPlay/mobile/build/reports/lint-results-debug.html
            OpenXPlay-DiPlay/samples/home/build/reports/lint-results-debug.html
            OpenXPlay-DiPlay/samples/maphost/build/reports/lint-results-debug.html
