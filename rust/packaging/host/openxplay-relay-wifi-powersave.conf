# Created by riko chen on 2026-10-16
# Disable Wi-Fi power save for latency-sensitive streaming. Measured on wcn36xx:
# power save caused 626 ms average ping (42 ms disabled), with video
# arriving in bursts up to 1 s. Apply on the next Wi-Fi connection activation.
[connection]
wifi.powersave = 2
